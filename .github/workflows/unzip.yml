herename: Unzip Vxx Music

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip Project
        run: unzip -o vxx-music.zip

      - name: Remove ZIP
        run: rm vxx-music.zip

      - name: Commit Extracted Files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Extract vxx-music.zip" || echo "No changes"
          git push
